  - { id: claude-sonnet-5-5,     provider: anthropic, tier: frontier, label: Sonnet 5.5,       price_input_per_mtok: 2.00, price_cached_input_per_mtok: 0.10,  price_output_per_mtok: 10.00, effort: medium }
