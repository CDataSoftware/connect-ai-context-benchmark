# TASKS. Each task is a prompt + golden + scoring mode, run across its own conditions.
#   scoring: answer        -> scorer.score()      (R1: health + eligibility)
#            answer_r2     -> scorer.score_r2()   (R2: health + usage-trend composition)
#            action        -> scorer.score_action() graded on REVIEW_QUEUE's end state, not prose
# Conditions: baseline is raw access (the standard Connect AI tools); baseline_context is the
# same tools plus search_context over the shared context entries in setup/context/. Each condition
# names a toolset, sent to the MCP endpoint as its ?ops= allowlist.
toolsets:
  read:          [get_catalogs, get_schemas, get_tables, get_columns, get_instructions, queryData]
  read_context:  [get_catalogs, get_schemas, get_tables, get_columns, get_instructions, queryData, search_context]
  # A1 writes REVIEW_QUEUE through execute_insert, which accepts INSERT only.
  write:         [get_catalogs, get_schemas, get_tables, get_columns, get_instructions, queryData, execute_insert]
  write_context: [get_catalogs, get_schemas, get_tables, get_columns, get_instructions, queryData, execute_insert, search_context]

tasks:
  - id: r1
    prompt_file: config/prompt.txt
    golden_file: config/golden_result.csv
    scoring: answer
    # R1 runs are tagged {model}__{condition}__run{n}, with no task segment.
    legacy_tag: true
    conditions:
      - { name: baseline,         toolset: read,          runs: 5, turn_cap: 40 }
      - { name: baseline_context, toolset: read_context,  runs: 5, turn_cap: 40 }

  - id: r2
    prompt_file: config/prompt_r2.txt
    golden_file: config/golden_result_r2.csv   # 44 rows, generated by make_goldens.py
    scoring: answer_r2
    conditions:
      - { name: baseline,         toolset: read,          runs: 5, turn_cap: 40 }
      - { name: baseline_context, toolset: read_context,  runs: 5, turn_cap: 40 }

  - id: a1
    prompt_file: config/prompt_a1.txt
    system_file: config/system_a1.txt   # the shared system prompt asks for a report, not changes
    golden_file: config/golden_action_a1.csv   # the 21 eligible-CRITICAL accounts
    scoring: action
    # every run of this task resets REVIEW_QUEUE before it starts and reads the table back
    # afterwards over the harness's own credentials (core/verifier.py) -- never via the MCP
    # endpoint under test, which would be circular.
    reset_before_run: true
    conditions:
      - { name: baseline,         toolset: write,         runs: 5, turn_cap: 40 }
      - { name: baseline_context, toolset: write_context, runs: 5, turn_cap: 40 }

# temperature: applied where the provider allows it. Reasoning-on OpenAI and thinking-on
# Anthropic force the provider default (~1.0); per-run temperature_applied records what happened.
temperature: 0
turn_cap: 12   # fallback if a condition omits turn_cap
